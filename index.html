<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a2744">
<title>Mikra · Mayorista</title>
<style>
    :root {
        --navy: #1a2744; --navy2: #24345a; --bg: #f3f4f6; --card: #ffffff; --line: #e5e7eb;
        --text: #111827; --muted: #6b7280; --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --acc: #2563eb;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { padding-bottom: calc(86px + env(safe-area-inset-bottom)); }
    button { font-family: inherit; }

    /* Encabezado */
    .top { position: sticky; top: 0; z-index: 20; background: var(--navy); color: #fff; padding: 8px 12px; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
    .top-row { display: flex; align-items: center; gap: 10px; max-width: 900px; margin: 0 auto; }
    .brand { font-weight: 900; letter-spacing: 3px; font-size: 1em; line-height: 1.05; flex: none; }
    .brand small { display: block; font-size: 0.52em; letter-spacing: 1.5px; font-weight: 700; opacity: .7; }
    body:not(.en-art):not(.en-cart) .top-title { display: none; }
    .back { display: none; background: none; border: none; color: #fff; font-size: 1.5em; padding: 0 4px 0 0; cursor: pointer; }
    body.en-art .back, body.en-cart .back { display: block; }
    body.en-art .brand, body.en-cart .brand { display: none; }   /* adentro se ve el título */
    .top-title { flex: 1; min-width: 0; font-weight: 800; font-size: 1.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .search { flex: 1; min-width: 0; position: relative; }
    .search input { width: 100%; padding: 9px 36px 9px 12px; border-radius: 12px; border: none; font-size: 16px; outline: none; background: #fff; color: var(--text); }
    .search button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: none; background: none; font-size: 1.1em; color: var(--muted); cursor: pointer; display: none; }
    .search.con button { display: block; }
    body.en-art .search, body.en-cart .search { display: none; }

    .wrap { max-width: 900px; margin: 0 auto; padding: 12px; }
    .info { font-size: 0.78em; color: var(--muted); margin: 2px 2px 10px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

    /* Lista de artículos */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .art { background: var(--card); border-radius: 14px; overflow: hidden; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.06); display: flex; flex-direction: column; }
    .art:active { transform: scale(.98); }
    .art .ph { aspect-ratio: 1/1; background: #e5e7eb; position: relative; overflow: hidden; }
    .art .ph img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; display: block; }
    .art .ph .enc { position: absolute; top: 8px; right: 8px; background: var(--ok); color: #fff; font-weight: 800; font-size: 0.75em; padding: 3px 8px; border-radius: 10px; }
    .art .bd { padding: 9px 10px 11px; }
    .art .nm { font-weight: 800; font-size: 0.9em; line-height: 1.2; min-height: 2.4em; }
    .art .pr { font-weight: 900; color: var(--navy); margin-top: 5px; font-size: 1.05em; }
    .art .pr small { font-weight: 600; color: var(--muted); font-size: 0.7em; }
    .art .cl { font-size: 0.75em; color: var(--muted); margin-top: 2px; }
    .vacio { text-align: center; color: var(--muted); padding: 40px 10px; }

    /* Artículo */
    .art-head { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .art-head .nm { font-weight: 900; font-size: 1.1em; }
    .art-head .pr { font-weight: 900; color: var(--navy); font-size: 1.25em; white-space: nowrap; }
    .art-head .pr small { font-size: 0.6em; color: var(--muted); font-weight: 600; }
    .leyenda { font-size: 0.74em; color: var(--muted); margin: -2px 2px 10px; }
    .col { background: var(--card); border-radius: 14px; padding: 10px; margin-bottom: 10px; display: flex; gap: 12px; }
    .col .ph { width: 76px; flex: none; aspect-ratio: 3/4; border-radius: 10px; overflow: hidden; background: #e5e7eb; cursor: zoom-in; }
    .col .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .col .der { flex: 1; min-width: 0; }
    .col .cn { font-weight: 800; font-size: 1em; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .col .cn .cnt { font-size: 0.75em; font-weight: 800; color: #fff; background: var(--acc); padding: 2px 8px; border-radius: 10px; }
    .tz { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .t { position: relative; width: 58px; border: 2px solid var(--line); border-radius: 10px; text-align: center; padding: 6px 2px 5px; cursor: pointer; user-select: none; background: #fff; }
    .t:active { transform: scale(.95); }
    .t b { display: block; font-size: 0.95em; }
    .t i { display: block; font-style: normal; font-size: 0.72em; font-weight: 700; margin-top: 2px; }
    .t i.r1 { color: var(--warn); } .t i.rok { color: var(--ok); }
    .t.ag { opacity: .45; cursor: not-allowed; background: #f9fafb; }
    .t.ag i { color: var(--bad); }
    .t.on { border-color: var(--acc); background: #eff6ff; }
    .t .q { position: absolute; top: -9px; right: -7px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: var(--acc); color: #fff; font-size: 0.75em; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .acc { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .acc button { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 6px 10px; font-size: 0.78em; font-weight: 700; cursor: pointer; color: var(--text); }
    .acc button.menos { color: var(--bad); }

    /* Barra del pedido */
    .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(243,244,246,.92); backdrop-filter: blur(6px); display: none; }
    .bar.show { display: block; }
    .bar-in { max-width: 900px; margin: 0 auto; display: flex; gap: 8px; }
    .bar button { border: none; border-radius: 14px; padding: 14px 14px; font-size: 0.97em; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .bar .b-main { flex: 1; min-width: 0; justify-content: space-between; background: var(--navy); color: #fff; box-shadow: 0 4px 16px rgba(26,39,68,.35); }
    .bar .b-main span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar .b-main span:last-child { white-space: nowrap; }
    .bar .b-sec { flex: none; background: #fff; color: var(--navy); border: 2px solid var(--navy); padding: 12px 11px; white-space: nowrap; gap: 6px; }
    .bar .b-sec.solo { flex: 1; justify-content: center; }

    /* Sugerencias del buscador */
    .search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
    .sug { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: #fff; color: var(--text); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); display: none; max-height: 70vh; overflow-y: auto; z-index: 40; }
    .sug.show { display: block; }
    .sug-todo { padding: 12px 14px; font-weight: 800; font-size: 0.9em; color: var(--acc); cursor: pointer; border-bottom: 1px solid var(--line); background: #f8fafc; }
    .sug-it { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
    .sug-it:last-child { border-bottom: none; }
    .sug-it:active, .sug-todo:active { background: #eff6ff; }
    .sug-it .mini { width: 40px; height: 52px; border-radius: 8px; overflow: hidden; background: #e5e7eb; flex: none; }
    .sug-it .mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sug-it .sn { flex: 1; min-width: 0; font-weight: 800; font-size: 0.9em; line-height: 1.2; }
    .sug-it .sn small { display: block; font-weight: 600; color: var(--muted); font-size: 0.85em; margin-top: 2px; }
    .sug-it .sp { font-weight: 900; color: var(--navy); white-space: nowrap; font-size: 0.92em; }
    .sug-it .ir { color: var(--muted); font-size: 1.3em; }

    /* Pedido */
    .linea-art { background: var(--card); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
    .linea-art .h { display: flex; justify-content: space-between; gap: 8px; font-weight: 800; font-size: 0.95em; }
    .linea-art .h span:last-child { color: var(--navy); white-space: nowrap; }
    .linea-art .sub { font-size: 0.75em; color: var(--muted); margin: 2px 0 6px; }
    .li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 0.88em; }
    .li .d { flex: 1; min-width: 0; }
    .li .d small { color: var(--muted); }
    .step { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .step button { border: none; background: #f9fafb; width: 34px; height: 32px; font-size: 1.1em; font-weight: 800; cursor: pointer; color: var(--text); }
    .step span { min-width: 30px; text-align: center; font-weight: 800; }
    .tot { background: var(--navy); color: #fff; border-radius: 14px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 900; font-size: 1.15em; margin: 4px 0 12px; }
    .tot small { display: block; font-size: 0.6em; font-weight: 600; opacity: .8; }
    .campo { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
    .campo label { display: block; font-size: 0.72em; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
    .campo input, .campo textarea { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); font-size: 16px; font-family: inherit; outline: none; }
    .campo input:focus, .campo textarea:focus { border-color: var(--acc); }
    .campo input.err { border-color: var(--bad); animation: tiembla .3s; }
    @keyframes tiembla { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    .btn-wa { width: 100%; border: none; border-radius: 14px; background: #25d366; color: #0b3d1f; font-weight: 900; font-size: 1.05em; padding: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-vaciar { width: 100%; border: none; background: none; color: var(--bad); font-weight: 700; padding: 12px; margin-top: 6px; cursor: pointer; }
    .nota { font-size: 0.74em; color: var(--muted); text-align: center; margin-top: 8px; }

    /* Foto grande */
    .zoom { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.9); display: none; align-items: center; justify-content: center; padding: 20px; }
    .zoom.show { display: flex; }
    .zoom img { max-width: 100%; max-height: 90vh; border-radius: 12px; }
    .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 0.88em; font-weight: 700; z-index: 70; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; text-align: center; }
    .toast.show { opacity: 1; }
    .cargando { text-align: center; padding: 60px 10px; color: var(--muted); }
    .t { -webkit-touch-callout: none; touch-action: manipulation; }

    /* Cantidades (número que se escribe) */
    .qty { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; flex: none; }
    .qty button { border: none; background: #f9fafb; width: 38px; height: 38px; font-size: 1.15em; font-weight: 800; cursor: pointer; color: var(--text); }
    .qty button:disabled { opacity: .35; cursor: not-allowed; }
    .qty input { width: 54px; height: 38px; border: none; border-left: 1px solid var(--line); border-right: 1px solid var(--line); text-align: center; font-size: 16px; font-weight: 800; outline: none; font-family: inherit; color: var(--text); -moz-appearance: textfield; background: #fff; }
    .qty input::-webkit-outer-spin-button, .qty input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .qty input:focus { background: #eff6ff; }
    .qty.lleno input { color: var(--acc); }
    .qty.chico button { width: 34px; height: 34px; } .qty.chico input { width: 50px; height: 34px; }

    /* Editor de un color (hoja que sube desde abajo) */
    .sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,.5); display: none; align-items: flex-end; justify-content: center; }
    .sheet-bg.show { display: flex; }
    .sheet { background: #fff; width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); max-height: 90vh; overflow-y: auto; animation: sube .18s ease-out; }
    @keyframes sube { from { transform: translateY(40px); opacity: .5; } }
    @media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 18px; } }
    .sh-h { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
    .sh-h .mini { width: 44px; height: 58px; border-radius: 8px; overflow: hidden; background: #e5e7eb; flex: none; }
    .sh-h .mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sh-h .tt { flex: 1; min-width: 0; }
    .sh-h .t1 { font-weight: 900; font-size: 1.02em; }
    .sh-h .t2 { font-size: 0.82em; color: var(--muted); margin-top: 2px; }
    .sh-h .x { border: none; background: #f3f4f6; width: 36px; height: 36px; border-radius: 50%; font-size: 1.05em; cursor: pointer; flex: none; color: var(--text); }
    .sh-todos { background: #f3f6fb; border-radius: 12px; padding: 10px; margin-bottom: 6px; }
    .sh-todos .lb { font-size: 0.72em; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 7px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .chips button { border: 1px solid var(--line); background: #fff; border-radius: 10px; min-width: 42px; height: 36px; padding: 0 8px; font-weight: 800; cursor: pointer; color: var(--text); font-size: 0.9em; }
    .chips button:active { background: #eff6ff; border-color: var(--acc); }
    .chips .otro { display: flex; gap: 4px; }
    .chips .otro input { width: 54px; height: 36px; border: 1px solid var(--line); border-radius: 10px; text-align: center; font-size: 16px; font-weight: 800; outline: none; font-family: inherit; }
    .sh-row { display: flex; align-items: center; gap: 10px; padding: 7px 2px; border-top: 1px solid var(--line); }
    .sh-row:first-of-type { border-top: none; }
    .sh-row .tl { width: 44px; font-weight: 900; font-size: 1.02em; }
    .sh-row .rg { flex: 1; font-size: 0.78em; font-weight: 700; color: var(--ok); }
    .sh-row .rg.r1 { color: var(--warn); }
    .sh-row.ag .tl, .sh-row.ag .rg { opacity: .45; } .sh-row.ag .rg { color: var(--bad); }
    .sh-sum { font-size: 0.85em; font-weight: 800; color: var(--navy); text-align: right; margin-top: 8px; }
    .sh-foot { display: flex; gap: 8px; margin-top: 12px; }
    .sh-foot button { border: none; border-radius: 12px; padding: 13px 14px; font-weight: 900; font-size: 0.95em; cursor: pointer; }
    .sh-foot .quitar { background: #fef2f2; color: var(--bad); }
    .sh-foot .listo { flex: 1; background: var(--navy); color: #fff; }

    /* Pedido: grupo por color */
    .cg { border-top: 1px solid var(--line); padding-top: 6px; margin-top: 4px; }
    .cg-h { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 0.9em; padding: 2px 0; }
    .cg-h .cnm { flex: 1; min-width: 0; }
    .cg-img { width: 34px; height: 44px; border-radius: 7px; overflow: hidden; background: #e5e7eb; flex: none; cursor: zoom-in; }
    .cg-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cg-h .cnm small { color: var(--muted); font-weight: 700; }
    .ic { border: 1px solid var(--line); background: #fff; border-radius: 9px; height: 32px; padding: 0 10px; font-size: 0.8em; font-weight: 800; cursor: pointer; color: var(--text); white-space: nowrap; }
    .ic.del { color: var(--bad); }
    .cg .li { border-top: none; padding: 4px 0 4px 10px; }
    .art-del { display: flex; justify-content: flex-end; margin-top: 6px; }
    .art-del button { border: none; background: none; color: var(--bad); font-weight: 700; font-size: 0.8em; cursor: pointer; padding: 4px 0; }

    /* Carrito compacto: una línea por color, tocar = editar */
    .cart-ayuda { font-size: 0.75em; color: var(--muted); margin: 0 2px 8px; }
    .linea-art { padding: 9px 10px; }
    .linea-art .sub { display: flex; justify-content: space-between; align-items: center; margin: 1px 0 4px; }
    .lnk-del { border: none; background: none; color: var(--bad); font-weight: 700; font-size: 1em; cursor: pointer; padding: 2px 0; }
    .cr { display: flex; align-items: center; gap: 9px; padding: 6px 0; border-top: 1px solid var(--line); cursor: pointer; }
    .cr:active { background: #f8fafc; }
    .cr-img { width: 34px; height: 42px; border-radius: 6px; overflow: hidden; background: #e5e7eb; flex: none; }
    .cr-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cr-d { flex: 1; min-width: 0; }
    .cr-n { font-weight: 800; font-size: 0.86em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cr-n small { color: var(--muted); font-weight: 700; }
    .cr-t { font-size: 0.78em; color: var(--text); margin-top: 1px; }
    .cr-t b { color: var(--acc); }
    .cr-ed { color: var(--muted); font-size: 0.9em; flex: none; }
    .cr-del { border: none; background: none; font-size: 0.95em; padding: 6px 4px; cursor: pointer; flex: none; }

    /* Aviso con Deshacer */
    .undo { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 80; background: #111827; color: #fff; border-radius: 12px; padding: 8px 8px 8px 14px; display: none; align-items: center; gap: 12px; font-size: 0.88em; width: max-content; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.3); max-width: 92vw; }
    .undo.show { display: flex; }
    .undo button { border: none; background: none; color: #93c5fd; font-weight: 900; font-size: 0.95em; padding: 8px 10px; cursor: pointer; white-space: nowrap; }
</style>
</head>
<body>
<div class="top">
    <div class="top-row">
        <button class="back" onclick="volver()" aria-label="Volver">‹</button>
        <div class="brand" id="brand">MIKRA<small>MAYORISTA</small></div>
        <div class="top-title" id="topTitle"></div>
    <div class="search" id="searchBox">
        <input id="q" type="search" placeholder="🔍 Buscar artículo" autocomplete="off" oninput="buscar()" onfocus="pintarSug()" onblur="setTimeout(cerrarSug, 150)" onkeydown="if(event.key==='Enter'){cerrarSug();this.blur();}">
        <button onclick="limpiarBusqueda()" aria-label="Borrar">✕</button>
        <div class="sug" id="sug" onpointerdown="event.preventDefault()"></div>
    </div>
    </div>
</div>

<div class="wrap" id="main"><div class="cargando">Cargando catálogo…</div></div>

<div class="bar" id="bar"><div class="bar-in">
    <button class="b-sec" id="barBack" onclick="atrasBarra()">‹ <span id="barBackTxt">Artículos</span></button>
    <button class="b-main" id="barCart" onclick="verPedido()"><span id="barTxt">🛒</span><span id="barVer">Ver pedido ›</span></button>
</div></div>
<div class="zoom" id="zoom" onclick="this.classList.remove('show')"><img id="zoomImg" alt=""></div>
<div class="toast" id="toast"></div>
<div class="sheet-bg" id="sheetBg" onclick="if(event.target===this)cerrarEditor()"><div class="sheet" id="sheet"></div></div>
<div class="undo" id="undo"><span id="undoTxt"></span><button onclick="deshacer()">Deshacer</button></div>

<script>
// ── Configuración ──
const API = 'https://mikra-mayorista.rafaelassir.workers.dev';
const WHATSAPP = '5491124824669';   // número de Mikra con código de país, ej. '5491112345678'. Vacío = elegir el contacto al compartir.

const $ = id => document.getElementById(id);
const fmt = n => '$' + Math.round(n).toLocaleString('es-AR');
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const chica = u => String(u || '').replace(/-O\.(jpe?g|webp)$/i, '-V.$1');   // foto mediana (la -O pesa el doble)
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

let CAT = null;          // { at, stockAt, arts: [{ n, p, cols: [{ c, img, t: [[talle, sku, rango]] }] }] }
let vista = 'lista';     // lista | art | cart
let artActual = null;
let _nota = '';         // nota del pedido (sobrevive a los + / −)
let pedido = {};         // sku → { q, n (artículo), c (color), t (talle), p (precio) }
try { pedido = JSON.parse(localStorage.getItem('mk_may_pedido') || '{}') || {}; } catch (e) { pedido = {}; }

// Rango de stock (el worker nunca manda el número exacto)
function rangoTxt(r) { return r <= 0 ? 'Agotado' : r === 1 ? 'Últimas' : '+' + r; }
let MAX = {};   // sku → stock real (tope para no pedir de más; en pantalla igual se ve el rango)

async function cargar(silencioso) {   // devuelve cuántos talles del pedido hubo que corregir
    try {
        const r = await fetch(API + '/catalogo', { cache: 'no-store' });
        const d = await r.json();
        if (!d || !d.arts) throw new Error(d && d.error || 'sin datos');
        CAT = d;
        // primero los colores con más stock (el worker manda rangos: se suman)
        CAT.arts.forEach(a => {
            a.cols.sort((x, y) => puntos(y) - puntos(x) || x.c.localeCompare(y.c, 'es'));
            a.st = a.cols.reduce((s, c) => s + puntos(c), 0);
        });
        _cargadoAt = Date.now();
        // lo que había en el pedido y ya no existe / se agotó / supera lo que hay: se corrige
        const vivos = {};
        MAX = {};
        CAT.arts.forEach(a => a.cols.forEach(c => c.t.forEach(t => {
            vivos[t[1]] = { r: t[2], p: a.p };
            if (t.length > 3) MAX[t[1]] = Math.max(0, t[3]);
        })));
        let sacados = 0, bajados = 0;
        Object.keys(pedido).forEach(sku => {
            const v = vivos[sku];
            if (!v || v.r <= 0 || maxDe(sku) <= 0) { delete pedido[sku]; sacados++; return; }
            pedido[sku].p = v.p;   // precio actualizado
            if (pedido[sku].q > maxDe(sku)) { pedido[sku].q = maxDe(sku); bajados++; }
        });
        if (sacados || bajados) {
            guardar();
            toast(sacados && bajados ? 'Se actualizó el stock: se ajustaron ' + (sacados + bajados) + ' talles'
                : sacados ? 'Se sacaron ' + sacados + ' talles que ya no hay' : 'Se ajustaron ' + bajados + ' talles a lo que hay');
        }
        if (silencioso) {   // actualizar sin mover la pantalla
            if (vista === 'art' && artActual) artActual = CAT.arts.find(x => x.n === artActual.n) || null;
            if (vista === 'art' && !artActual) aLista(); else if (!_ed) pintar(); else pintarBarra();
        } else abrirDesdeHash();
        return sacados + bajados;
    } catch (e) {
        if (silencioso) return 0;
        $('main').innerHTML = '<div class="vacio">No se pudo cargar el catálogo 😕<br><br><button class="btn-vaciar" style="color:var(--acc)" onclick="location.reload()">Reintentar</button></div>';
    }
}

            const img = fotoDe(a.n, c.c);
            h += '<div class="cr" onclick="editarColor(_g[' + ai + '].n,_g[' + ai + '].cols[' + ci + '].c)">' +
                '<div class="cr-img">' + (img ? '<img src="' + esc(chica(img)) + '" loading="lazy" referrerpolicy="no-referrer" alt="">' : '') + '</div>' +
                '<div class="cr-d"><div class="cr-n">' + esc(c.c) + ' <small>· ' + qc + '</small></div>' +
                '<div class="cr-t">' + c.its.map(x => esc(x.t) + ' <b>' + x.q + '</b>').join(' · ') + '</div></div>' +
                '<span class="cr-ed">✎</span>' +
                '<button class="cr-del" onclick="event.stopPropagation();quitarColorCart(' + ai + ',' + ci + ')" aria-label="Quitar color">🗑</button></div>';
        });
        h += '</div>';
    });
    h += '<div class="tot"><span>TOTAL<small>' + prendas + ' prendas</small></span><span>' + fmt(total) + '</span></div>';
    h += '<div class="campo"><label>Tu nombre o negocio *</label><input id="cliNombre" autocomplete="name" placeholder="Ej: Moda Laura" value="' + esc(localStorage.getItem('mk_may_nombre') || '') + '" oninput="localStorage.setItem(\'mk_may_nombre\', this.value)"></div>';
    h += '<div class="campo"><label>Nota (opcional)</label><textarea id="cliNota" rows="2" placeholder="Ej: envío por expreso…" oninput="_nota=this.value">' + esc(_nota) + '</textarea></div>';
    h += '<button class="btn-wa" onclick="enviar()"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.1-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>Enviar pedido por WhatsApp</button>';
    h += '<div class="nota">Precios mayoristas. El stock se confirma al preparar el pedido.</div>';
    h += '<button class="btn-vaciar" onclick="vaciar()">Vaciar pedido</button>';
    $('main').innerHTML = h;
}
let _g = [];   // último pedido agrupado que se pintó (para los botones)
function cartSet(sku, v) {
    const q = setQ(sku, Math.min(Number(v) || 0, maxDe(sku)));
    guardar(); pintar();
    if (!q) toast('Se quitó ese talle');
}
function quitarColorCart(ai, ci) {
    const a = _g[ai], c = a && a.cols[ci]; if (!c) return;
    quitarSkus(c.its.map(x => x.sku), 'Se quitó ' + c.c);
}
function quitarArtCart(ai) {
    const a = _g[ai]; if (!a) return;
    quitarSkus(a.cols.flatMap(c => c.its.map(x => x.sku)), 'Se quitó ' + a.n);
}
function vaciar() {
    const skus = Object.keys(pedido);
    if (!skus.length || !confirm('¿Vaciar todo el pedido?')) return;
    quitarSkus(skus, 'Se vació el pedido');
}
let _enviando = false;
async function enviar() {
    const inp = $('cliNombre'), nombre = inp.value.trim();
    if (!nombre) { inp.classList.remove('err'); void inp.offsetWidth; inp.classList.add('err'); inp.focus(); vibrar(60); toast('Escribí tu nombre o el de tu negocio'); return; }
    if (_enviando) return;
    _enviando = true; toast('Revisando stock…');
    let cambios = 0;
    try { cambios = await cargar(true); } finally { _enviando = false; }
    if (cambios) { vibrar(80); toast('El stock cambió: revisá el pedido antes de enviarlo'); return; }
    if (!Object.keys(pedido).length) return;
    const nota = (_nota || '').trim();
    const g = agrupado(), { prendas, total } = totales();
    let txt = '*PEDIDO MAYORISTA — ' + nombre + '*\n';
    g.forEach(a => {
        const q = a.cols.reduce((s, c) => s + c.its.reduce((t, x) => t + x.q, 0), 0);
        txt += '\n*' + a.n + '* (' + fmt(a.p) + ' c/u)\n';
        a.cols.forEach(c => { txt += '• ' + c.c + ': ' + c.its.map(x => x.t + '×' + x.q).join(', ') + '\n'; });
        txt += '   ' + q + ' prendas = ' + fmt(q * a.p) + '\n';
    });
    txt += '\n*TOTAL: ' + prendas + ' prendas · ' + fmt(total) + '*\n';
    if (nota) txt += '\nNota: ' + nota + '\n';
    txt += '\nCODIGOS:\n';
    g.forEach(a => a.cols.forEach(c => c.its.forEach(x => { txt += x.sku + '\t' + x.q + '\n'; })));
    location.href = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(txt);   // abre WhatsApp directo al número de Mikra
}

// ── Pintar ──
function pintarBarra() {
    const { prendas, total } = totales();
    // lista: solo el pedido · artículo: ‹ Artículos + pedido · pedido: ‹ Seguir comprando
    $('bar').classList.toggle('show', vista !== 'lista' || prendas > 0);
    $('barBack').style.display = vista === 'lista' ? 'none' : '';
    $('barBackTxt').textContent = vista === 'cart' ? 'Seguir comprando' : 'Artículos';
    $('barCart').style.display = vista === 'cart' || !prendas ? 'none' : '';
    $('barBack').classList.toggle('solo', $('barCart').style.display === 'none');
    const corto = vista !== 'lista';   // al lado del botón ‹ Artículos va más corto
    $('barTxt').textContent = '🛒 ' + prendas + (corto ? '' : prendas === 1 ? ' prenda' : ' prendas') + ' · ' + fmt(total);
    $('barVer').textContent = corto ? 'Pedido ›' : 'Ver pedido ›';
}
function pintar() {
    if (!CAT) return;
    if (vista === 'art' && artActual) pintarArt();
    else if (vista === 'cart') pintarCart();
    else pintarLista();
    pintarBarra();
}
cargar();
// si la página quedó abierta un rato, al volver a mirarla trae el stock nuevo
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && CAT && Date.now() - _cargadoAt > 5 * 60 * 1000) cargar(true);
});
</script>
